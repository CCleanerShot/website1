<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="styles.css">
        <script src="https://cdn.jsdelivr.net/npm/axios@1.1.2/dist/axios.min.js"></script>
        <script src="../index.js" defer></script>
    </head>
    <body class="bg-gray-100">
        <div id="header" class="flex w-screen">
            <div id="session-container" class="container-neutral flex-8">
                <div id="session-header">CURRENT SESSION:</div>
                <div>
                    <div></div>
                    <div id="session-username-header">Username: </div>
                    <div id="session-username-field"></div>
                </div>
                <div>
                    <div id="session-items-header">Tracked Items:</div>
                    <div id="session-items-field"></div>
                </div>
            </div>
            <div id="login-container" class="container-neutral flex-4 text-center">
                <div id="login-header" class="font-bold text-">LOGIN / SIGNUP</div>
                <div id="login-field">
                    <div id="login-header">
                        <div id="login-header-text">Username:</div>
                        <div id="login-header-warning" class="text-red-600 hidden">INVALID USER\/PASS</div>
                    </div>
                    <input id="submit-username" type="text" class="bg-slate-100">
                </div>
                <div id="login-password-field">
                    <div>Password: </div>
                    <input id="submit-password" type="password">
                </div>
                <div id="login-button-field">
                    <button id="login-button" class="bg-slate-100">Submit</button>
                </div>
            </div>
        </div>
        <div id="content">

            <div id="add-item-container" class="container-2 text-center">
                <div id="add-item-header">
                    <div id="add-item-header-text">Insert an Amazon URL here:</div>
                    <button id="add-item-button">Submit</button>
                    <div id="add-item-header-warning" class=""></div>
                </div>
                <input id="submit-url" type="text" class="bg-slate-100 w-1/2 text-xs">
            </div>
            <div id="item-table-container">
                <div id="item-table"></div>
                <div id="item-table-header">
                    <div id="item-table-header-p1">
                        <div id="item-table-header-text">Display Items</div>
                        <div id="item-table-header-warning" class="text-red-600 hidden">NOT LOGGED IN</div>
                    </div>
                    <div id="item-table-header-p2">
                        <div id="item-table-header-button"></div>
                    </div>
                </div>
                <div id="item-table-contents">
                    
                </div>
            </div>
        </div>
        <div></div>
    </body>
</html>
