<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="styles.css">
        <script src="https://cdn.jsdelivr.net/npm/axios@1.1.2/dist/axios.min.js"></script>
        <script src="../index.js" defer></script>
    </head>
    <body class="bg-gray-100">
        <div id="header" class="flex w-screen">
            <div id="session-container" class="container-neutral flex-2">
                <div id="session-header" class="text-bold-1">CURRENT SESSION:</div>
                <div>
                    <div></div>
                    <div id="session-username-header" class="text-bold-1">Username: </div>
                    <div id="session-username-field" class="text-bold-1 invisible">PLACEHOLDER</div>
                </div>
                <div>
                    <div id="session-items-header" class="text-bold-1">Tracked Items:</div>
                    <div id="session-items-field" class="invisible flex">PLACEHOLDER</div>
                </div>
            </div>
            <div id="login-container" class="container-neutral flex-1 text-center">
                <div id="login-username-field">
                    <div id="login-header">
                        <div id="login-header-text">Username:</div>
                    </div>
                    <input id="submit-username" type="text" class="bg-slate-100">
                </div>
                <div id="login-password-field">
                    <div>Password: </div>
                    <input id="submit-password" type="password">
                </div>
                <div id="login-button-field" class="flex">
                    <span id="login-warning-false" class="text-red-600 invisible text-bold-1">INVALID USER/PASS</span>
                    <button id="login-button" class="bg-slate-100 text-bold-1 flex-1">LOGIN/SIGNUP</button>
                    <span id="login-warning" class="text-red-600 invisible text-bold-1">INVALID USER/PASS</span>
                </div>
            </div>
        </div>
        <div id="content">

            <div id="add-item-container" class="container-2 text-center">
                <div id="add-item-header">
                    <div id="add-item-header-text">Insert an Amazon URL here:</div>
                    <button id="add-item-button">Submit</button>
                    <div id="add-item-header-warning" class="hidden">NOT A VALID URL</div>
                </div>
                <input id="submit-url" type="text" class="bg-slate-100 w-1/2 text-xs">
            </div>
            <div id="item-table-container">
                <div id="item-table"></div>
                <div id="item-table-header">
                    <div id="item-table-header-p1">
                        <div id="item-table-header-text">Display Items</div>
                        <div id="item-table-header-warning" class="text-red-600 hidden">NOT LOGGED IN</div>
                    </div>
                    <div id="item-table-header-p2">
                        <button id="item-table-header-button">DISPLAY</button>
                    </div>
                </div>
                <div id="item-table-contents">
                    
                </div>
            </div>
        </div>
        <div></div>
    </body>
</html>
