<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="styles.css">
        <script src="https://cdn.jsdelivr.net/npm/axios@1.1.2/dist/axios.min.js"></script>
        <script src="../index.js" defer></script>
    </head>
    <body class="bg-gray-100">
        <div id="header" class="flex">
            <div id="session-container" class="container-neutral w-1/2 flex-4">
                <div id="session-header">CURRENT SESSION:</div>
                <div>
                    <div></div>
                    <div id="session-username-header">Username: </div>
                    <div id="session-username-field"></div>
                </div>
                <div>
                    <div id="session-items-header">Tracked Items:</div>
                    <div id="session-items-field"></div>
                </div>
            </div>
            <div id="login-container" class="container-neutral flex-8 text-center">
                <div id="login-header" class="font-bold">LOGIN / SIGNUP</div>
                <div id="login-field">
                    <div id="login-header">
                        <div id="login-header-text">Username: USER/PASS USER\/PASS</div>
                        <div id="login-header-warning" class="text-red-600 hidden">INVALID USER\/PASS</div>
                    </div>
                    <input id="submit-username" type="text" class="bg-slate-100">
                </div>
                <div id="login-password-field">
                    <div>Password: </div>
                    <input id="submit-password" type="password">
                </div>
                <div id="login-button-field">
                    <button id="login-button" class="bg-slate-100">Submit</button>
                </div>
            </div>
        </div>
        <div id="content">

            <div id="add-item-container" class="container-2">
                <div id="add-item-header">
                    <div id="add-item-header-text">Insert an Amazon URL here:</div>
                    <div id="add-item-header-warning"></div>
                </div>
                <input id="submit-addItemRequest" type="text" class="bg-slate-100">
                <button id="add-item-button">Submit</button>
            </div>

            <div id="items-table-container">

            </div>
        </div>
        <div></div>
    </body>
</html>
