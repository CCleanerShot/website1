<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="styles.css">
        <script src="https://cdn.jsdelivr.net/npm/axios@1.1.2/dist/axios.min.js"></script>
        <script src="../index.js" defer></script>
    </head>
    <body class="bg-gray-100">
        <div id="header">
            <div id="session-container" class="container-1 w-1">
                <div id="session-header">CURRENT SESSION:</div>
                <div>
                    <div></div>
                    <div id="session-username-header">Username: </div>
                    <div id="session-username-field"></div>
                </div>
                <div>
                    <div id="session-items-header">Tracked Items:</div>
                    <div id="session-items-field"></div>
                </div>
            </div>
        </div>
        <div id="content">
            <div id="login-container" class="container-2">
                <div id="login-header">Login or Signup Here</div>
                <div id="login-username-field">
                    <div id="login-username-header">
                        <div id="login-username-header-text">Username:</div>
                        <div id="login-username-header-warning" class="text-red-600 hidden"></div>
                    </div>
                    <input id="submit-username" type="text" class="bg-slate-100">

                </div>
                <div id="login-password-field">
                    <div>Password: </div>
                    <input id="submit-password" type="password">
                </div>
                <div id="login-button-field">
                    <button id="submit-login" class="bg-slate-100">Submit</button>
                </div>
            </div>
            <div id="requestUrl-container" class="container-2">
                <div id="requestUrl-header">Insert a URL here:</div>
                <input id="submit-requestURL" type="text" class="bg-slate-100">
                <button id="submit-requestURL">Submit</button>
            </div>
        </div>
        <div></div>
    </body>
</html>
